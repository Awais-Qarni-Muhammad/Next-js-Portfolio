<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1-product-analytics" cx="22%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2-product-analytics" cx="85%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge-product-analytics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid-product-analytics" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#38bdf8" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <mask id="fade-product-analytics">
      <rect width="640" height="420" fill="white"/>
      <radialGradient id="fadegrad-product-analytics" cx="50%" cy="42%" r="60%">
        <stop offset="0%" stop-color="white"/>
        <stop offset="100%" stop-color="black"/>
      </radialGradient>
      <rect width="640" height="420" fill="url(#fadegrad-product-analytics)" opacity="0.35"/>
    </mask>
  </defs>

  <rect width="640" height="420" fill="#070a16"/>
  <rect width="640" height="420" fill="url(#grid-product-analytics)" mask="url(#fade-product-analytics)"/>
  <rect width="640" height="420" fill="url(#glow1-product-analytics)"/>
  <rect width="640" height="420" fill="url(#glow2-product-analytics)"/>

  <circle cx="320.0" cy="196.0" r="72" fill="white" fill-opacity="0.035"/>
  <circle cx="320.0" cy="196.0" r="72" fill="none" stroke="url(#badge-product-analytics)" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="320.0" cy="196.0" r="54" fill="url(#badge-product-analytics)" fill-opacity="0.16"/>

  <g transform="translate(320.0, 196.0)">
    
    <line x1="-44" y1="34" x2="44" y2="34" stroke="white" stroke-width="4" stroke-opacity="0.5"/>
    <rect x="-36" y="4" width="16" height="30" rx="3" fill="white" fill-opacity="0.85"/>
    <rect x="-10" y="-16" width="16" height="50" rx="3" fill="white" fill-opacity="0.95"/>
    <rect x="16" y="-32" width="16" height="66" rx="3" fill="white" fill-opacity="0.75"/>
    
  </g>
