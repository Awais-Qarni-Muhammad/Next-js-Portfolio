<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1-food-ordering" cx="22%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2-food-ordering" cx="85%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge-food-ordering" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid-food-ordering" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#f59e0b" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <mask id="fade-food-ordering">
      <rect width="640" height="420" fill="white"/>
      <radialGradient id="fadegrad-food-ordering" cx="50%" cy="42%" r="60%">
        <stop offset="0%" stop-color="white"/>
        <stop offset="100%" stop-color="black"/>
      </radialGradient>
      <rect width="640" height="420" fill="url(#fadegrad-food-ordering)" opacity="0.35"/>
    </mask>
  </defs>

  <rect width="640" height="420" fill="#070a16"/>
  <rect width="640" height="420" fill="url(#grid-food-ordering)" mask="url(#fade-food-ordering)"/>
  <rect width="640" height="420" fill="url(#glow1-food-ordering)"/>
  <rect width="640" height="420" fill="url(#glow2-food-ordering)"/>

  <circle cx="320.0" cy="196.0" r="72" fill="white" fill-opacity="0.035"/>
  <circle cx="320.0" cy="196.0" r="72" fill="none" stroke="url(#badge-food-ordering)" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="320.0" cy="196.0" r="54" fill="url(#badge-food-ordering)" fill-opacity="0.16"/>

  <g transform="translate(320.0, 196.0)">
    
    <circle cx="0" cy="0" r="40" fill="none" stroke="white" stroke-width="5" stroke-opacity="0.92"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="white" stroke-width="3.5" stroke-opacity="0.55"/>
    <line x1="-56" y1="-30" x2="-56" y2="30" stroke="white" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="-64" y1="-30" x2="-64" y2="-6" stroke="white" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="-48" y1="-30" x2="-48" y2="-6" stroke="white" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
    
  </g>
</svg>