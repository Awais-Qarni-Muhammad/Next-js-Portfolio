<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1-warehouse-management" cx="22%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2-warehouse-management" cx="85%" cy="90%" r="60%">
